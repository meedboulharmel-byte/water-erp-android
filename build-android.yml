name: Build WATER ERP APK

# Builds an installable debug APK for com.sidilahcen.watererp.
# The repo ships WITHOUT a Gradle wrapper (gradlew / gradle-wrapper.jar are
# missing), so we install Gradle 8.7 via the official action and generate the
# wrapper on the fly before building. The Android SDK (platform 34 +
# build-tools) is pre-installed on the ubuntu-latest runner, so no sdkmanager
# calls are needed -> avoids "sdkmanager: command not found" and
# "Failed to find package 'tools'".

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Directory that contains settings.gradle.kts.
    # This workflow assumes the Gradle project is at the repository ROOT.
    # If you keep the project inside an "android/" sub-folder, change this to: android
    env:
      PROJECT_DIR: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper (missing in repo)
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.7

      - name: Show environment (diagnostics)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          ./gradlew --version

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WATER-ERP-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
